<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>侧边导航栏复刻</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --line: #e2e8f0;
      --text: #94a3b8;
      --primary: #3b82f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: "Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 68px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 16px;
      gap: 14px;
    }

    .nav-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: transparent;
      color: var(--text);
      transition: .2s ease;
    }

    .nav-btn:hover {
      background: #f1f5f9;
      color: #64748b;
    }

    .nav-btn.active {
      color: var(--primary);
      background: #eaf2ff;
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .nav-bottom {
      margin-top: auto;
    }

    .demo-main {
      flex: 1;
      display: grid;
      place-items: center;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="侧边导航">
      <!-- 保留顶部图标 -->
      <button class="nav-btn active" aria-label="看板">
        <!-- dashboard/grid -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="8" height="8" rx="1.5"></rect>
          <rect x="13" y="3" width="8" height="8" rx="1.5"></rect>
          <rect x="3" y="13" width="8" height="8" rx="1.5"></rect>
          <rect x="13" y="13" width="8" height="8" rx="1.5"></rect>
        </svg>
      </button>

      <!-- 中间图标已删除 -->

      <!-- 保留底部设置图标 -->
      <div class="nav-bottom">
        <button class="nav-btn" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.23-1.13.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.82 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.23 1.13-.54 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"></path>
          </svg>
        </button>
      </div>
    </aside>

    <main class="demo-main">主内容区域</main>
  </div>
</body>
</html>
